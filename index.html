/* gradient direction + independent colors (fallbacks keep the old look) */

const RES=["نُفذت حصص الانتظار المسندة وفق الجدول المعتمد، واستُثمر زمنها في أنشطة تلاوة ومراجعة، مع المحافظة على انضباط الطلاب وسير اليوم الدراسي.", "وُزّع المقرر على أسابيع الفصل الدراسي، وتمت متابعة تنفيذه أسبوعياً مع تعويض ما يتأخر من دروس، بما يضمن تغطية المنهج في وقته.", "تحقق الالتزام بالحضور والانصراف وبداية الحصص وفق سجل الدوام الرسمي المعتمد.", "شارك المعلم في الإشراف والمناوبة وفق الجدول، وأسهم في المحافظة على سلامة الطلاب وانضباطهم ورفع الملاحظات المهمة لإدارة المدرسة.", "أسهمت الأنشطة والفقرات الوطنية في تعزيز الولاء والاعتزاز بالوطن لدى الطلاب، وربط القيم الإسلامية بقيم المواطنة، وتفاعل الطلاب مع المناسبات الوطنية.", "أتاحت الزيارات المتبادلة الاطلاع على ممارسات ناجحة وتبادل الخبرات، وأُفيد منها في تحسين أساليب التدريس داخل الفصل.", "أسهمت المبادرة في خدمة الطلاب والمدرسة، وعززت روح المبادرة والعمل التطوعي لدى المستفيدين.", "أسفرت الجلسة عن تبادل خبرات ناجحة، والاتفاق على استراتيجيات مناسبة، وتحديد خطة لمعالجة جوانب الضعف مع توصيات للمتابعة.", "اكتسب المعلم مهارات جديدة في تدريس القرآن الكريم والدراسات الإسلامية، وطبّق ما تعلمه في الحصص الدراسية.", "تحددت جوانب القوة في الممارسات التدريسية وجوانب التطوير، وأُعدّت خطة تحسين تتم متابعتها خلال الفصل.", "أسهم هذا التواصل في رفع مستوى الشراكة بين المدرسة والأسرة، ومتابعة تحصيل الطلاب بشكل دوري وفعّال عبر منصة مدرستي، وتفاعل أولياء الأمور إيجابياً.", "تعرّف أولياء الأمور على خطط المدرسة ومستوى الطلاب، وتعزز التعاون بين المنزل والمدرسة في دعم تعلم الأبناء.", "أسهمت متابعة أولياء الأمور للخطة الأسبوعية في تحسين التزام الطلاب بالواجبات ومراجعة المحفوظات.", "تم الاتفاق مع ولي الأمر على إجراءات دعم مشتركة لمعالجة الصعوبات مبكراً ومتابعتها.",  "ارتفع تفاعل الطلاب داخل الصف وتحسّن فهمهم للدرس، مع تنمية مهارات التفكير والتعاون ومراعاة الفروق الفردية.", "تدرّج الطلاب المشمولون بالخطة العلاجية نحو تحسّن مستواهم في التلاوة ومخارج الحروف والحفظ، مع تواصل مستمر مع أسرهم.", "تحددت نقاط القوة والضعف في مهارات الاختبار، وبُنيت عليها إجراءات علاجية وإثرائية مناسبة.", "زادت دافعية الطلاب نحو الحفظ والتلاوة والسلوك الحسن، وعزز التكريم روح التنافس الشريف بين الطلاب.", "أتاحت المقارنة بين الاختبارين قياس أثر المعالجة وتحديد الطلاب الذين يحتاجون إلى متابعة إضافية.", "تمت متابعة تنفيذ الدروس وفق الخطة وقياس نسبة الإنجاز، مع تعويض ما تأخر منها في الوقت المناسب.", "تعرّف المعلم على أنماط تعلم الطلاب وخطّط أنشطة سمعية وبصرية وحركية تناسبها، مما رفع فاعلية التعلم.", "أُعدّت الدروس مسبقاً بأهداف واضحة وأنشطة متنوعة وأساليب تقويم مناسبة.", "نُفذت أنشطة صفية ولاصفية أثرت المقرر ونمّت مهارات الطلاب وقيمهم.", "أسهم توظيف التقنية في عرض المحتوى بوضوح وتبسيط المفاهيم وزيادة تفاعل الطلاب، مع ترسيخ الاستخدام الآمن للتقنية.", "أسهمت الوسائل التعليمية المحسوسة والبصرية في تبسيط المفاهيم وجذب انتباه الطلاب وإشراكهم في إعدادها.", "أسهم التحفيز المادي والمعنوي في تهيئة بيئة صفية إيجابية وزيادة مشاركة الطلاب في الحفظ والتلاوة.", "تعزز انضباط الطلاب وسلوكهم الإيجابي عبر إجراءات تربوية متدرجة بالتنسيق مع الموجّه الطلابي وأولياء الأمور.", "انتظمت متابعة الحضور والمشاركة، وزادت مشاركة الطلاب الفاعلة في الحصة.", "التزم الطلاب بالقواعد الصفية المتفق عليها، وتعزز الاحترام وآداب الاستماع للقرآن الكريم.", "حُلّلت نتائج الاختبارات وصُنّف الطلاب إلى متقدم ومتوسط ويحتاج دعماً، وبُني التدريس والعلاج على نتائج التحليل.", "رُصدت المهارات غير المتقنة ونُفذت المعالجة المناسبة مع متابعتها وقياس أثرها.", "حدد الاختبار التشخيصي مستوى الطلاب والمهارات غير المتقنة قبل بدء التعلم، وبُنيت عليه خطة التدريس.", "أتاح التقويم التكويني متابعة تعلم الطلاب وتقديم تغذية راجعة فورية وتعديل التدريس بحسب الحاجة.", "ساعدت بطاقة الملاحظة على تحديد احتياج كل طالب واختيار طريقة التعليم الأنسب له.", "نمّت المشاريع وملفات الإنجاز مهارات البحث والإبداع لدى الطلاب، وقُوّم أداؤهم بسلالم التقدير."];let _k=0;I.forEach(it=>it.ev.forEach(e=>e[8]=RES[_k++]));

let SPG="",ROF="";
function ros(){if(!Array.isArray(S.roster))S.roster=[];return S.roster}
const rid=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const gkey=s=>(s.g||"")+"|"+(s.c||"");
function grpLabel(k){const p=k.split("|");return(p[0]||"بدون صف")+(p[1]?" – فصل "+p[1]:"")}
function spGroups(){const m={};ros().forEach(s=>{(m[gkey(s)]=m[gkey(s)]||[]).push(s)});Object.keys(m).forEach(k=>m[k].sort((a,b)=>a.n.localeCompare(b.n,"ar")));return m}
