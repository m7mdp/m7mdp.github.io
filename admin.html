<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة مدير النظام — ملف شواهد الأداء الوظيفي</title>
<style>
:root{--g1:#2a7fc1;--g2:#3fb57d;--pr:#16967c;--ink:#12302f;--mu:#5b7270;--bd:#d6e0e4;--bg:#f3f6f8;--card:#fff;--ok:#1b8a4b;--warn:#a86400;--bad:#b3392f;--navy:#0f3d4a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;min-height:42px}
button.pri{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:700}button.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.bad{background:#fff;border-color:#e3b9b5;color:var(--bad)}button.warn{border-color:#ecd29b;color:var(--warn)}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{border:1px solid #c5d3d7;border-radius:10px;padding:8px 10px;min-height:44px;font-size:16px;background:#fff;width:100%}
.top{background:linear-gradient(to right,var(--g1),var(--g2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:40px}.top b{font-size:1.1em}.top .sp{flex:1}.top a,.top button{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:999px;text-decoration:none;padding:6px 14px;min-height:38px;display:inline-flex;align-items:center}
.tabs{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd);overflow-x:auto;position:sticky;top:0;z-index:5}
.tabs button{border-radius:999px;white-space:nowrap;border-color:transparent}.tabs button.on{background:var(--navy);color:#fff}.tabs .n{background:#fde7c4;color:#8a5200;border-radius:999px;padding:0 8px;margin-right:6px;font-size:.85em}
main{max-width:1150px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.15em;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:1.9em;color:var(--navy)}.stat.p b{color:var(--warn)}.stat.a b{color:var(--ok)}.stat.r b,.stat.s b{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters input{flex:2;min-width:200px}.filters select{flex:1;min-width:150px;width:auto}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid #eaf0f2;text-align:right;vertical-align:middle}th{background:#f4f8f9;font-size:.88em;color:#294a52}
td .acts{display:flex;gap:6px;flex-wrap:wrap}td .acts button{min-height:36px;padding:4px 10px;font-size:.9em}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.85em;font-weight:700}.b-pending{background:#fff3dc;color:var(--warn)}.b-approved{background:#e3f4ea;color:var(--ok)}.b-rejected{background:#fdecea;color:var(--bad)}.b-suspended{background:#f1ecf9;color:#6a3fa0}
.empty{text-align:center;color:var(--mu);padding:24px}
.sm{color:var(--mu);font-size:.88em}
#md{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;background:rgba(10,30,40,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.mdb{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.mdb h3{margin:0 0 8px;color:var(--navy)}.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;margin:8px 0}.kv span{color:var(--mu)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f3d4a;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:99;max-width:90vw}
.gate{max-width:440px;margin:40px auto;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 10px 40px rgba(15,61,74,.12)}.gate label{display:block;margin:10px 0}.err{background:#fdecea;color:#9b2c22;border:1px solid #f3c2bc;border-radius:10px;padding:8px 10px;margin:8px 0;display:none}
.log td{font-size:.9em}.switch{display:flex;gap:10px;align-items:center}.switch input{width:24px;height:24px;min-height:0}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}table.resp thead{display:none}table.resp tr{display:block;border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;padding:6px;background:#fff}table.resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:5px 6px}table.resp td::before{content:attr(data-l);color:var(--mu);font-size:.85em;flex:none}.kv{grid-template-columns:1fr}}
</style>
</head>

var sb,ME,ROWS=[],REQ={},TAB="home",F={q:"",st:"all"},A=window.A={};

function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none"},3000)}
function modal(h){close();var o=document.createElement("div");o.id="md";o.innerHTML='<div class="mdb">'+h+'</div>';o.onclick=function(e){if(e.target===o)close()};document.body.appendChild(o)}
function close(){var o=$("#md");if(o)o.remove()}A.close=close;
function errMsg(e){var m=(e&&e.message)||"";if(/NOT_ADMIN/.test(m))return"ليست لديك صلاحية مدير النظام.";if(/CANNOT_CHANGE_SELF/.test(m))return"لا يمكنك تغيير حالة حسابك.";if(/CANNOT_CHANGE_ADMIN/.test(m))return"لا يمكن تغيير حالة مدير نظام من اللوحة.";if(/Failed to fetch|network/i.test(m))return"تعذر الاتصال بالخادم.";return"حدث خطأ: "+m}
function load1(src){return new Promise(function(ok,no){var s=document.createElement("script");s.src=src;s.onload=function(){window.supabase&&window.supabase.createClient?ok():no()};s.onerror=function(){s.remove();no()};document.head.appendChild(s)})}
async function load(l){if(window.supabase&&window.supabase.createClient)return;for(var i=0;i<l.length;i++){try{await load1(l[i]);return}catch(e){}}throw new Error("lib")}

A.login=async function(ev){ev.preventDefault();var r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(r.error){var e=$("#er");e.textContent="البريد أو كلمة المرور غير صحيحة.";e.style.display="block";return}start(r.data.user)};
A.logout=async function(){if(sb)await sb.auth.signOut();location.href="index.html"};
async function boot(){
 if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY){$("#root").innerHTML='<div class="gate"><h2>لم تُضبط قاعدة البيانات</h2><p>أضف رابط المشروع والمفتاح العام في <code>js/config.js</code> كما في دليل الإعداد.</p></div>';return}
 var k=String(CFG.SUPABASE_ANON_KEY);var bad=/^sb_secret_/.test(k);try{bad=bad||/service_role/.test(atob((k.split(".")[1]||"").replace(/-/g,"+").replace(/_/g,"/")))}catch(e){}if(bad){$("#root").innerHTML='<div class="gate"><h2>تم الإيقاف للحماية</h2><p>المفتاح في <code>js/config.js</code> مفتاح سري لا يجوز نشره. ضع المفتاح العام Publishable بدلاً منه، وألغِ المفتاح السري من لوحة Supabase.</p></div>';return}
 try{await load(LIBS)}catch(e){$("#root").innerHTML='<div class="gate"><h2>تعذر الاتصال</h2><p>تحقق من الإنترنت ثم أعد تحميل الصفحة.</p></div>';return}
 sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 var s=await sb.auth.getSession();if(s.data&&s.data.session)start(s.data.session.user);else gate("")}
async function start(user){
 var p=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(p.error||!p.data||p.data.role!=="super_admin"||p.data.status!=="approved"){gate("هذا الحساب ليس حساب مدير نظام. صلاحيات المدير تُمنح من لوحة Supabase فقط.");return}
 ME=p.data;$("#me").textContent=ME.full_name||ME.email;await refresh();draw()}
async function refresh(){
 var q=await Promise.all([sb.from("profiles").select("*").order("created_at",{ascending:false}),sb.from("registration_requests").select("*").order("submitted_at",{ascending:false})]);
 if(q[0].error){toast(errMsg(q[0].error));return}ROWS=q[0].data||[];REQ={};(q[1].data||[]).forEach(function(r){if(!REQ[r.user_id])REQ[r.user_id]=r})}

function draw(){var c=counts();
 var tabs='<div class="tabs">'+[["home","🏠 الرئيسية"],["req","📝 طلبات التسجيل"+(c.pending?'<span class="n">'+c.pending+'</span>':"")],["teachers","👥 المعلمون"],["log","📜 سجل العمليات"],["settings","⚙️ إعدادات المنصة"]].map(function(t){return'<button class="'+(TAB===t[0]?"on":"")+'" onclick="A.tab(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")+'</div>';

 if(TAB==="home")body='<div class="stats">'+[["total","إجمالي المعلمين",""],["approved","الحسابات النشطة","a"],["pending","طلبات معلقة","p"],["rejected","حسابات مرفوضة","r"],["suspended","حسابات موقوفة","s"]].map(function(x){return'<div class="stat '+x[2]+'"><b>'+(c[x[0]]||0)+'</b>'+x[1]+'</div>'}).join("")+'</div>'+(c.pending?'<div class="card" style="margin-top:14px"><h2>طلبات بانتظار المراجعة</h2>'+table(ROWS.filter(function(r){return r.status==="pending"&&r.role==="teacher"}).slice(0,5),true)+'<div class="bar"><button class="pri" onclick="A.tab(\'req\')">عرض كل الطلبات</button></div></div>':'<div class="card" style="margin-top:14px"><p class="sm" style="margin:0">لا توجد طلبات معلقة حالياً.</p></div>');
 else if(TAB==="req"){var list=filtered(true);body='<div class="card"><h2>طلبات التسجيل</h2>'+filters(true)+table(list,true)+'</div>'}
 else if(TAB==="teachers"){var l2=filtered(false);body='<div class="card"><h2>المعلمون</h2>'+filters(false)+table(l2,false)+'</div>'}
 else if(TAB==="log")body='<div class="card"><h2>سجل العمليات الإدارية</h2><div id="logb" class="empty">جارٍ التحميل…</div></div>';
 else if(TAB==="settings")body='<div class="card"><h2>إعدادات المنصة</h2><div id="setb" class="empty">جارٍ التحميل…</div></div>';

 if(TAB==="log")loadLog();if(TAB==="settings")loadSettings()}
function filters(req){return'<div class="filters"><input placeholder="🔎 بحث بالاسم أو البريد أو المدرسة أو التخصص" value="'+E(F.q)+'" oninput="A.q(this.value)">'+(req?'<select onchange="A.st(this.value)"><option value="pending"'+(F.st==="pending"||F.st==="all"?" selected":"")+'>المعلقة</option><option value="rejected"'+(F.st==="rejected"?" selected":"")+'>المرفوضة</option><option value="approved"'+(F.st==="approved"?" selected":"")+'>المقبولة</option></select>':'<select onchange="A.st(this.value)"><option value="all">كل الحالات</option>'+Object.keys(ST).map(function(k){return'<option value="'+k+'"'+(F.st===k?" selected":"")+'>'+ST[k]+'</option>'}).join("")+'</select>')+'</div>'}
function filtered(req){var q=F.q.trim().toLowerCase(),st=req&&F.st==="all"?"pending":F.st;return ROWS.filter(function(r){if(r.role!=="teacher")return false;if(st!=="all"&&r.status!==st)return false;if(!q)return true;return[r.full_name,r.email,r.school,r.specialty,r.edu_admin].join(" ").toLowerCase().indexOf(q)>=0})}
function table(list,req){if(!list.length)return'<div class="empty">لا توجد نتائج</div>';
 return'<div style="overflow-x:auto"><table class="resp"><thead><tr><th>الاسم</th><th>المدرسة</th><th>التخصص</th><th>'+(req?"تاريخ التسجيل":"تاريخ الإنشاء")+'</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>'+list.map(function(r){var id=E(r.id);return'<tr><td data-l="الاسم"><b>'+E(r.full_name||"—")+'</b><div class="sm" dir="ltr" style="text-align:right">'+E(r.email)+'</div></td><td data-l="المدرسة">'+E(r.school||"—")+'</td><td data-l="التخصص">'+E(r.specialty||"—")+'</td><td data-l="التاريخ">'+dt(r.created_at)+'</td><td data-l="الحالة">'+badge(r.status)+'</td><td data-l="إجراءات"><div class="acts"><button onclick="A.view(\''+id+'\')">عرض</button>'+acts(r)+'</div></td></tr>'}).join("")+'</tbody></table></div>'}
function acts(r){var id=E(r.id);if(r.status==="pending")return'<button class="ok" onclick="A.approve(\''+id+'\')">قبول</button><button class="bad" onclick="A.reject(\''+id+'\')">رفض</button>';if(r.status==="approved")return'<button class="warn" onclick="A.suspend(\''+id+'\')">إيقاف</button>';if(r.status==="suspended")return'<button class="ok" onclick="A.approve(\''+id+'\',1)">إعادة تفعيل</button>';if(r.status==="rejected")return'<button class="ok" onclick="A.approve(\''+id+'\')">قبول</button>';return""}
A.tab=async function(t){TAB=t;F={q:"",st:t==="req"?"pending":"all"};draw();scrollTo(0,0);if(t!=="settings"){await refresh();if(TAB===t&&!$("#md"))redraw()}};
function redraw(){var a=document.activeElement,typing=a&&a.matches&&a.matches(".filters input");if(typing)return;draw()}
setInterval(function(){if(ME&&!document.hidden&&TAB!=="settings"&&!$("#md"))refresh().then(redraw)},60000);
document.addEventListener("visibilitychange",function(){if(ME&&!document.hidden&&TAB!=="settings"&&!$("#md"))refresh().then(redraw)});
A.q=function(v){F.q=v;var a=document.activeElement,pos=a&&a.selectionStart;draw();var i=$(".filters input");if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}};
A.st=function(v){F.st=v;draw()};
A.view=function(id){var r=ROWS.find(function(x){return x.id===id});if(!r)return;var q=REQ[id]||{};
 modal('<h3>'+E(r.full_name||"—")+' '+badge(r.status)+'</h3><div class="kv"><span>البريد</span><b dir="ltr" style="text-align:right">'+E(r.email)+'</b><span>الجوال</span><b dir="ltr" style="text-align:right">'+E(r.phone||"—")+'</b><span>نوع المستخدم</span><b>'+(r.user_type==="f"?"معلمة":"معلم")+'</b><span>المدرسة</span><b>'+E(r.school||"—")+'</b><span>المرحلة</span><b>'+E(r.stage||"—")+'</b><span>التخصص</span><b>'+E(r.specialty||"—")+'</b><span>الإدارة التعليمية</span><b>'+E(r.edu_admin||"—")+'</b><span>تاريخ التسجيل</span><b>'+dt(q.submitted_at||r.created_at)+'</b><span>تاريخ الاعتماد</span><b>'+dt(r.approved_at)+'</b>'+(r.status_reason?'<span>السبب</span><b>'+E(r.status_reason)+'</b>':"")+(q.decided_at?'<span>تاريخ القرار</span><b>'+dt(q.decided_at)+'</b>':"")+'</div><div class="bar">'+acts(r)+'<button onclick="A.close()">إغلاق</button></div>')};
async function setStatus(id,st,reason){var r=await sb.rpc("admin_set_status",{target:id,new_status:st,reason:reason||null});if(r.error){toast(errMsg(r.error));return false}await refresh();close();draw();return true}
A.approve=async function(id,re){var r=ROWS.find(function(x){return x.id===id});if(!confirm((re?"إعادة تفعيل حساب ":"قبول طلب ")+(r&&r.full_name||"")+"؟"))return;if(await setStatus(id,"approved"))toast(re?"تمت إعادة تفعيل الحساب":"تم اعتماد الحساب")};
function reasonBox(id,st,title,btn){modal('<h3>'+title+'</h3><label>السبب (يظهر للمعلم)<textarea id="rsn" rows="3" maxlength="500" placeholder="اكتب السبب باختصار"></textarea></label><div class="bar"><button class="bad" onclick="A.doReason(\''+E(id)+'\',\''+st+'\')">'+btn+'</button><button onclick="A.close()">إلغاء</button></div>');setTimeout(function(){var t=$("#rsn");if(t)t.focus()},50)}
A.reject=function(id){reasonBox(id,"rejected","رفض طلب التسجيل","تأكيد الرفض")};
A.suspend=function(id){reasonBox(id,"suspended","إيقاف الحساب","تأكيد الإيقاف")};
A.doReason=async function(id,st){var v=($("#rsn").value||"").trim();if(st==="rejected"&&!v){toast("اكتب سبب الرفض");return}if(await setStatus(id,st,v))toast(st==="rejected"?"تم رفض الطلب":"تم إيقاف الحساب")};
async function loadLog(){var r=await sb.from("audit_logs").select("*").order("created_at",{ascending:false}).limit(200);var b=$("#logb");if(!b)return;if(r.error){b.textContent=errMsg(r.error);return}
 var name=function(id){var p=ROWS.find(function(x){return x.id===id});return p?(p.full_name||p.email):(id?"—":"النظام")};
 var act=function(l){var d=l.details||{};if(l.action==="status_change")return"تغيير الحالة: "+(ST[d.from]||d.from)+" ← "+(ST[d.to]||d.to)+(d.reason?" ("+d.reason+")":"");if(l.action==="setting_change")return"تعديل إعداد: "+d.key;if(l.action==="first_admin")return"تعيين مدير النظام الأول";return l.action};
 b.className="";b.innerHTML=(r.data||[]).length?'<div style="overflow-x:auto"><table class="log resp"><thead><tr><th>الوقت</th><th>المنفّذ</th><th>العملية</th><th>المعلم</th></tr></thead><tbody>'+r.data.map(function(l){return'<tr><td data-l="الوقت">'+dt(l.created_at)+'</td><td data-l="المنفّذ">'+E(name(l.actor_id))+'</td><td data-l="العملية">'+E(act(l))+'</td><td data-l="المعلم">'+E(l.target_id?name(l.target_id):"—")+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="empty">لا توجد عمليات بعد</div>'}
async function loadSettings(){var r=await sb.from("platform_settings").select("*");var b=$("#setb");if(!b)return;if(r.error){b.textContent=errMsg(r.error);return}var m={};(r.data||[]).forEach(function(x){m[x.key]=x.value});
 b.className="";b.innerHTML='<label class="switch"><input type="checkbox" id="ro" '+(m.registration_open!==false?"checked":"")+'> السماح بتسجيل معلمين جدد</label><p class="sm">عند الإيقاف تختفي صفحة التسجيل ويُرفض أي تسجيل جديد من قاعدة البيانات نفسها.</p><label class="switch"><input type="checkbox" id="ra" '+(m.require_approval===true?"checked":"")+'> اشتراط موافقتي على كل معلم جديد</label><p class="sm">مطفأ افتراضياً: المعلم يدخل مباشرة بعد التسجيل. عند التفعيل تصل الحسابات الجديدة إلى «طلبات التسجيل» بانتظار قبولك.</p><label>رسالة تظهر للمعلمين في صفحة الدخول (اختياري)<textarea id="ann" rows="3" maxlength="300">'+E(typeof m.announcement==="string"?m.announcement:"")+'</textarea></label><div class="bar"><button class="pri" onclick="A.saveSettings()">حفظ الإعدادات</button></div>'}
A.saveSettings=async function(){var a=await sb.rpc("admin_set_setting",{setting_key:"registration_open",setting_value:$("#ro").checked});var c=await sb.rpc("admin_set_setting",{setting_key:"require_approval",setting_value:$("#ra").checked});var b=await sb.rpc("admin_set_setting",{setting_key:"announcement",setting_value:($("#ann").value||"").trim()});if(a.error||b.error||c.error){toast(errMsg(a.error||b.error||c.error));return}toast("تم حفظ الإعدادات")};
boot();
})();
</script>
